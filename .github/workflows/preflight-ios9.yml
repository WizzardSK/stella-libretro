name: Preflight ios9

# Not for upstream. The buildbot's ios9 job is the only place this target gets
# built, and it failed at link; this runs the same build on a macOS runner so
# the fix can be tried without waiting for a nightly.

on:
  push:
    branches:
      - preflight-ios9
  workflow_dispatch:

jobs:
  ios9:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -version -sdk iphoneos Path

      - name: Build the core for armv7
        run: |
          make -C src/os/libretro -j$(sysctl -n hw.ncpu) platform=ios9
          ls -l src/os/libretro/stella_libretro_ios.dylib
          lipo -info src/os/libretro/stella_libretro_ios.dylib
          mv src/os/libretro/stella_libretro_ios.dylib stella_libretro_ios9.dylib

      # The point of moving the pin is that all four Apple jobs build from the
      # tip, so the other two are worth the minutes here rather than a nightly.
      - name: Build the core for arm64
        run: |
          make -C src/os/libretro clean
          make -C src/os/libretro -j$(sysctl -n hw.ncpu) platform=ios-arm64
          lipo -info src/os/libretro/stella_libretro_ios.dylib

      - name: Build the core for tvOS
        run: |
          make -C src/os/libretro clean
          make -C src/os/libretro -j$(sysctl -n hw.ncpu) platform=tvos-arm64
          ls -l src/os/libretro/stella_libretro_tvos.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: stella_libretro_ios9
          path: stella_libretro_ios9.dylib
